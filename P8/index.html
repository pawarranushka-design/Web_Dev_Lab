
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Navbar and Card Overlay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>Anushka</h2>
        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
        </div>
    </nav>

    <header id="home">
        <h1>Welcome to My Portfolio</h1>
        <p>Creative Ideas | Web Development</p>
    </header>

    <main>
        <section id="about">
            <h2>About Me</h2>
            <p>I am learning web development and creating modern websites.</p>
        </section>

        <section id="projects">
            <h2>My Project</h2>

            <div class="card">
                <div class="overlay">
                    <h3>My Portfolio</h3>
                    <p>A creative website made using HTML and CSS.</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Anushka Pawar</p>
    </footer>

</body>
</html>
